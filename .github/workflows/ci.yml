name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            minimum_coverage: "71.4"
          - os: ubuntu-latest
            platform: linux
            minimum_coverage: "70.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bind governance to checked diff and workflow provenance
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $currentCommit = (git rev-parse HEAD).Trim()
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $baselineCommit = (git merge-base HEAD 'origin/${{ github.base_ref }}').Trim()
          } else {
            $eventBefore = '${{ github.event.before }}'
            git cat-file -e "$eventBefore^{commit}" 2>$null
            $eventBeforeExists = $LASTEXITCODE -eq 0
            if ($eventBefore -match '^[0-9a-f]{40}$' -and
                $eventBefore -ne ('0' * 40) -and
                $eventBeforeExists) {
              $baselineCommit = $eventBefore
            } elseif ((git rev-list --count HEAD) -gt 1) {
              $baselineCommit = (git rev-parse HEAD^).Trim()
            } else {
              $baselineCommit = $currentCommit
            }
          }
          $changedPaths = @(
            git diff --name-only "$baselineCommit...$currentCommit" |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          $recordPath = Join-Path $env:RUNNER_TEMP 'flashgate-assignment-record.json'
          $repository = 'https://github.com/${{ github.repository }}.git'
          $workflowCommit = '${{ github.workflow_sha }}'
          $hostedCISources = @(
            '${{ github.repository }}@${{ github.sha }}'
            'github-actions-run:${{ github.run_id }}'
          )
          .\scripts\New-GovernanceWorkflowRecord.ps1 `
            -OutputPath $recordPath `
            -Checkpoint SPRINT_CLOSE `
            -ChangedPath $changedPaths `
            -Repository $repository `
            -BaselineCommit $baselineCommit `
            -CurrentCommit $currentCommit `
            -WorkflowCommit $workflowCommit `
            -RunId '${{ github.run_id }}' `
            -RunAttempt ${{ github.run_attempt }} `
            -Event '${{ github.event_name }}' `
            -Ref '${{ github.ref }}' `
            -HeadSha '${{ github.sha }}'
          .\scripts\Test-GovernanceConsistency.ps1 `
            -AssignmentRecordPath $recordPath `
            -ChangedPath $changedPaths `
            -RuntimeCheckpoint SPRINT_CLOSE `
            -HostedCISource $hostedCISources `
            -ExpectedRepository $repository `
            -ExpectedBaselineCommit $baselineCommit `
            -ExpectedCurrentCommit $currentCommit `
            -ExpectedWorkflowCommit $workflowCommit `
            -ExpectedRunId '${{ github.run_id }}' `
            -ExpectedRunAttempt ${{ github.run_attempt }} `
            -ExpectedEvent '${{ github.event_name }}' `
            -ExpectedRef '${{ github.ref }}' `
            -ExpectedHeadSha '${{ github.sha }}'
          .\scripts\Test-GovernanceConsistencyFixtures.ps1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        shell: pwsh
        run: ./scripts/Test-GoCoverage.ps1 -PlatformName '${{ matrix.platform }}' -MinimumCoverage ${{ matrix.minimum_coverage }}

      - name: Upload coverage report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/coverage/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        shell: bash
        run: |
          mkdir -p build

          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o build/flashgate-mcp.exe ./cmd/server
          else
            go build -o build/flashgate-mcp ./cmd/server
          fi

      - name: JSON-RPC smoke test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-jsonrpc.sh

      - name: JSON-RPC smoke test (Ubuntu read-only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          MCP_READ_ONLY: "true"
        run: bash scripts/smoke-jsonrpc.sh

      - name: Negative JSON-RPC smoke test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-jsonrpc-negative.sh

      - name: Startup negative smoke test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-startup-negative.sh

      - name: JSON-RPC smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-jsonrpc.ps1

      - name: JSON-RPC smoke test (Windows read-only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          MCP_READ_ONLY: "true"
        run: .\scripts\smoke-jsonrpc.ps1

      - name: Negative JSON-RPC smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-jsonrpc-negative.ps1

      - name: Startup negative smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-startup-negative.ps1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run
