name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  POWERSHELL_766_URI: https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip
  POWERSHELL_766_SHA256: 02FE458BE20493FBDF43F61EA20610B811EE6C738AB1676C61B9CFCD1A33C860

jobs:
  project-quality:
    name: Project quality (exact PR head)
    runs-on: windows-latest

    steps:
      - name: Select exact workflow commit
        id: exact_head
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = $null
          try {
            $expectedHead = if ($env:EVENT_NAME -eq 'pull_request') {
              $env:PULL_REQUEST_HEAD
            } else {
              $env:PUSH_HEAD
            }
            if ($expectedHead -notmatch '^[0-9a-f]{40}$') {
              throw "Expected workflow commit is not a full SHA-1: $expectedHead"
            }
            "ExpectedPullRequestHead: $expectedHead"
            "expected_head=$expectedHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } catch {
            "ExactHeadSelectionFailure: $($_.Exception.Message)"
            throw
          } finally {
            $expectedHead = $null
          }

      - name: Checkout exact workflow commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.exact_head.outputs.expected_head }}

      - name: Prepare PowerShell 7.6.6
        id: pwsh766
        shell: pwsh
        env:
          POWERSHELL_URI: ${{ env.POWERSHELL_766_URI }}
          POWERSHELL_SHA256: ${{ env.POWERSHELL_766_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packagePath = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64'
          $pwshPath = Join-Path $installRoot 'pwsh.exe'
          try {
            Invoke-WebRequest -Uri $env:POWERSHELL_URI -OutFile $packagePath
            $actualHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
            if ($actualHash -cne $env:POWERSHELL_SHA256) {
              throw "PowerShell package SHA-256 mismatch: expected=$($env:POWERSHELL_SHA256); actual=$actualHash"
            }
            [void][System.IO.Directory]::CreateDirectory($installRoot)
            Expand-Archive -LiteralPath $packagePath -DestinationPath $installRoot -Force
            if (-not (Test-Path -LiteralPath $pwshPath -PathType Leaf)) {
              throw "Extracted PowerShell executable does not exist: $pwshPath"
            }
            "PowerShellPackage: $packagePath"
            "PowerShellPackageSHA256: $actualHash"
            'PowerShellPackageHashGatePassed: true'
            "pwsh_path=$pwshPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "package_path=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            $installRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } catch {
            "PowerShellPreparationFailure: $($_.Exception.Message)"
            throw
          } finally {
            $actualHash = $null
          }

      - name: Validate PowerShell and Bash scripts on Windows
        shell: pwsh
        run: |
          .\scripts\Test-DocumentationConsistency.ps1
          .\scripts\Test-ShellScripts.ps1
          .\scripts\Test-ShellScripts.Tests.ps1 -WorkingPath $env:RUNNER_TEMP

  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            minimum_coverage: "90.0"
          - os: ubuntu-latest
            platform: linux
            minimum_coverage: "90.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare Windows test PowerShell 7.6.6
        if: matrix.os == 'windows-latest'
        id: test_pwsh766
        shell: pwsh
        env:
          POWERSHELL_URI: ${{ env.POWERSHELL_766_URI }}
          POWERSHELL_SHA256: ${{ env.POWERSHELL_766_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packagePath = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64-test.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64-test'
          $pwshPath = Join-Path $installRoot 'pwsh.exe'
          try {
            Invoke-WebRequest -Uri $env:POWERSHELL_URI -OutFile $packagePath
            $actualHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
            if ($actualHash -cne $env:POWERSHELL_SHA256) {
              throw "PowerShell package SHA-256 mismatch: expected=$($env:POWERSHELL_SHA256); actual=$actualHash"
            }
            [void][System.IO.Directory]::CreateDirectory($installRoot)
            Expand-Archive -LiteralPath $packagePath -DestinationPath $installRoot -Force
            if (-not (Test-Path -LiteralPath $pwshPath -PathType Leaf)) {
              throw "Extracted PowerShell executable does not exist: $pwshPath"
            }
            "PowerShellTestPackage: $packagePath"
            "PowerShellTestPackageSHA256: $actualHash"
            'PowerShellTestPackageHashGatePassed: true'
            "pwsh_path=$pwshPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "package_path=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            $installRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } catch {
            "PowerShellTestPreparationFailure: $($_.Exception.Message)"
            throw
          } finally {
            $actualHash = $null
          }

      - name: Bind Windows test job to exact PowerShell 7.6.6
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          EXPECTED_PWSH_PATH: ${{ steps.test_pwsh766.outputs.pwsh_path }}
          PWSH_PACKAGE_PATH: ${{ steps.test_pwsh766.outputs.package_path }}
          PWSH_PACKAGE_SHA256: ${{ env.POWERSHELL_766_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $result = $null
          try {
            $powerShellVersion = $PSVersionTable.PSVersion.ToString()
            $expectedPwshPath = [System.IO.Path]::GetFullPath($env:EXPECTED_PWSH_PATH)
            $resolvedActualPwshPath = [System.IO.Path]::GetFullPath((Get-Process -Id $PID).Path)
            $actualPackageSha256 = (Get-FileHash -LiteralPath $env:PWSH_PACKAGE_PATH -Algorithm SHA256).Hash
            if ($powerShellVersion -cne '7.6.6') {
              throw "PowerShell 7.6.6 is required; actual=$powerShellVersion"
            }
            if ($actualPackageSha256 -cne $env:PWSH_PACKAGE_SHA256) {
              throw "PowerShell package SHA-256 mismatch: expected=$($env:PWSH_PACKAGE_SHA256); actual=$actualPackageSha256"
            }
            $powerShellProcessPathParity = [string]::Equals(
              $resolvedActualPwshPath,
              $expectedPwshPath,
              [System.StringComparison]::OrdinalIgnoreCase
            )
            if (-not $powerShellProcessPathParity) {
              throw 'Windows test shell does not use the verified PowerShell executable.'
            }
            $result = [pscustomobject]@{
              Status = 'PASS'
              PowerShellVersion = $powerShellVersion
              ExpectedPowerShellPath = $expectedPwshPath
              ActualPowerShellPath = $resolvedActualPwshPath
              PowerShellPackageSHA256 = $actualPackageSha256
            }
          } catch {
            $result = [pscustomobject]@{ Status = 'FAIL'; Error = $_.Exception.Message }
            throw
          } finally {
            $result | Format-List
          }

      - name: Validate Bash scripts natively
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          FLASHGATE_WORK_ROOT: ${{ runner.temp }}/flashgate-shell-validation
        run: |
          mkdir -p -- "$FLASHGATE_WORK_ROOT"
          /usr/bin/bash scripts/test-shell-scripts.sh
          /usr/bin/bash scripts/test-shell-scripts.tests.sh

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        shell: pwsh
        run: ./scripts/Test-GoCoverage.ps1 -PlatformName '${{ matrix.platform }}' -MinimumCoverage ${{ matrix.minimum_coverage }}

      - name: Test stateful components with the race detector
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/test-go-race.sh

      - name: Upload coverage report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/coverage/${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        shell: bash
        run: |
          mkdir -p build

          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o build/flashgate-mcp.exe ./cmd/server
          else
            go build -o build/flashgate-mcp ./cmd/server
          fi

      - name: JSON-RPC smoke test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-jsonrpc.sh

      - name: JSON-RPC smoke test (Ubuntu read-only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          MCP_READ_ONLY: "true"
        run: bash scripts/smoke-jsonrpc.sh

      - name: Negative JSON-RPC smoke test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-jsonrpc-negative.sh

      - name: Startup negative smoke test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/smoke-startup-negative.sh

      - name: JSON-RPC smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-jsonrpc.ps1

      - name: JSON-RPC smoke test (Windows read-only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          MCP_READ_ONLY: "true"
        run: .\scripts\smoke-jsonrpc.ps1

      - name: Negative JSON-RPC smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-jsonrpc-negative.ps1

      - name: Startup negative smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-startup-negative.ps1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run
