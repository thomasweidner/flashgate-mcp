# FlashGate configuration template for direct STDIO.
# Set files.roots.work.path to an existing absolute data directory.
# On Windows use forward slashes or double each backslash in a basic string.
# See configuration.md for trusted paths, settings, and migration.

[runtime]
mode = "stdio"

[files]
default_id = "work"
max_file_size = "10 MiB"
max_write_size = "10 MiB"
max_scan_size = "10 MiB"
max_result_size = "16 MiB"
max_temp_size = "10 MiB"
max_list_entries = 1000
max_delete_entries = 1000

[files.roots.work]
path = ""
# Missing access at both levels defaults to ["read"]. Use [] to deny all.
# Set access = ["read", "write"] here or reference the example policy below.
# policy = "workspace"
# [policy.workspace]
# access = ["read", "write"]
# max_file_size = "1 MiB"
# max_write_size = "1 MiB"
# max_scan_size = "2 MiB"
# max_result_size = "4 MiB"
# max_temp_size = "1 MiB"

# The default profile is "read". Mutations also require a writable profile.
# [profiles]
# active = "write"

[security]
allow_hidden_files = false
allow_unc_paths = false
follow_symlinks = false

[protocol]
max_message_size = "16 MiB"
max_argument_size = "12 MiB"
max_response_size = "16 MiB"

# These defaults leave all managed endpoint behavior disabled in STDIO.
[endpoints]
windows_pipe_name = ""
linux_socket_path = ""
connect_timeout_ms = 5000
request_timeout_ms = 30000
shutdown_timeout_ms = 5000
max_frame_size = "16 MiB"
ipc_version = 1
fallback = "disabled"

[logging]
level = "off"
sink = "stderr"
format = "text"
max_record_size = "4 KiB"
max_records = 10000
