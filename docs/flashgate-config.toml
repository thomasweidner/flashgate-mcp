# FlashGate configuration template for direct STDIO.
# Replace root with one existing absolute directory you intend to expose.
# On Windows use forward slashes or double each backslash in a basic string.
# See configuration.md for trusted paths, settings, and migration.

[runtime]
mode = "stdio"

[filesystem]
root = ""
# The template opts into read-only. The decoder default is false.
read_only = true
# Development only. Explicit root = "." and allow_cwd_root = true are both needed.
allow_cwd_root = false
max_file_size = 10485760
max_write_bytes = 10485760
max_list_entries = 1000
max_copy_bytes = 10485760
max_delete_entries = 1000

[security]
allow_hidden_files = false
allow_unc_paths = false
follow_symlinks = false

[protocol]
max_message_bytes = 16777216
max_argument_bytes = 12582912
max_response_bytes = 16777216

# These defaults leave all managed endpoint behavior disabled in STDIO.
[endpoints]
windows_pipe_name = ""
linux_socket_path = ""
connect_timeout_ms = 5000
request_timeout_ms = 30000
shutdown_timeout_ms = 5000
max_frame_bytes = 16777216
ipc_version = 1
fallback = "disabled"

[logging]
level = "off"
sink = "stderr"
format = "text"
max_record_bytes = 4096
max_records = 10000
