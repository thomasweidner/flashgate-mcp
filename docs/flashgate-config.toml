# FlashGate configuration template for direct STDIO.
# Set files.work.path to an existing absolute data directory.
# On Windows use forward slashes or double each backslash in a basic string.
# See configuration.md for trusted paths, settings, and migration.

[runtime]
mode = "stdio"

[files]
default_id = "work"
max_file_size = "10 MiB"
max_write_size = "10 MiB"
max_scan_size = "10 MiB"
max_result_size = "16 MiB"
max_temp_size = "10 MiB"
max_list_entries = 1000
max_delete_entries = 1000

[files.work]
path = ""
# Missing access at both levels defaults to ["files.read"]. Use [] to deny all.
# Set access = ["files.read", "files.write"] here or reference the example policy below.
# policy = "workspace"
# Supported relative links inside this root only; omission defaults to false.
follow_symlinks = false
# Optional process working-directory selection. Omission defaults to false.
# allow_process_cwd = false
# Optional file restrictions; omitted fields add no extension restriction.
# allowed_extensions = [".txt", ".md", ".tar.gz"]
# allow_extensionless = false
# [] denies suffixed files. "unrestricted" removes an inherited suffix limit.
# Override allow_extensionless separately to replace an inherited boolean.
# Optional path exclusions use root-relative components with * and ?.
# An explicit list replaces inherited exclusions, including an empty list.
# excluded = ["private", "logs/my*.log"]
# [policy.workspace]
# access = ["files.read", "files.write"]
# follow_symlinks = false
# allow_process_cwd = false
# excluded = ["private", "logs/my*.log"]
# max_file_size = "1 MiB"
# max_write_size = "1 MiB"
# max_scan_size = "2 MiB"
# max_result_size = "4 MiB"
# max_temp_size = "1 MiB"

# The default profile is "read". Mutations also require a writable profile.
# [profiles]
# active = "write"

[security]
allow_hidden_files = false
allow_unc_paths = false

[protocol]
max_message_size = "16 MiB"
max_argument_size = "12 MiB"
max_response_size = "16 MiB"

# These defaults leave all managed endpoint behavior disabled in STDIO.
[endpoints]
windows_pipe_name = ""
linux_socket_path = ""
connect_timeout_ms = 5000
request_timeout_ms = 30000
shutdown_timeout_ms = 5000
max_frame_size = "16 MiB"
ipc_version = 1
fallback = "disabled"

[logging]
level = "off"
sink = "stderr"
format = "text"
max_record_size = "4 KiB"
max_records = 10000

[audit]
enabled = true
failure_policy = "operation_first"
store_path = ""
max_store_size = "256 MiB"
max_segment_size = "16 MiB"
retention = "30 d"
max_event_size = "4 KiB"
max_queue_events = 1024
max_queue_size = "4 MiB"
max_batch_events = 128
max_batch_size = "256 KiB"
flush_interval = "100 ms"
flush_timeout = "2 s"
required_intent_timeout = "2 s"
required_operations = []
